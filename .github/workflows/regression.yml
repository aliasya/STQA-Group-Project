# Week 9 - CI/CD example (Member 1): continuous testing for PyTodo Pro
# Runs every automated suite on each push / pull request, plus a nightly coverage run.
#
# The suites assert the CORRECT behaviour, so the 16 known open defects show up as failing
# tests. The job therefore reports results (JUnit XML artefact) instead of blocking the build.
# When a defect is fixed, its test turns green - compare the failure count against README §3.
name: PyTodo Pro QA

on:
  push:
  pull_request:
  schedule:
    - cron: "0 18 * * *"        # nightly (02:00 Malaysia time)

jobs:
  automated-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - name: White-box, API (= automated regression) and security suites
        run: pytest 02_White_Box_Coverage 04_Web_API 05_Security_Performance/Security --junitxml=results.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml

  coverage:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - name: Branch coverage of the application under test
        run: pytest 02_White_Box_Coverage 04_Web_API 05_Security_Performance/Security --cov=app --cov-branch --cov-report=html || true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
